[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-afib-research"
version = "0.2.0"
description = "Record-aware ECG representation learning: RR baselines and paired-wavelet contrastive experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
neural = ["torch>=2.1"]
signal = ["neurokit2>=0.2"]
wavelet = ["fcwt>=0.1"]
exploration = ["wfdb>=4"]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.7", "pandas>=2"]
dev = ["nbformat>=5", "nbclient>=0.10", "ruff>=0.8"]

[project.scripts]
ecg-afib = "ecg_afib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
