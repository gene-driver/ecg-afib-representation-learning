# rr_kpca_classifier: settings for the consolidated implementation, not a recovered historical run.
name = "rr_kpca_classifier"
method = "kpca_classifier"
seed = 42

[paths]
dataset = "data/processed/rr20"
splits = "data/splits.json"
output = "runs/rr_kpca_classifier"

[training]
epochs = 6
classifier_epochs = 50
batch_size = 16
learning_rate = 0.001
classifier_learning_rate = 0.001
temperature = 0.1
balance_classifier = true
device = "cpu"

[model]
embedding_dim = 2
rr_statistics = true
classifier_hidden = [8]
kpca_components = 21
standardize = false
