# rr_kernel_pca: settings for the consolidated implementation, not a recovered historical run.
name = "rr_kernel_pca"
method = "kpca"
seed = 42

[paths]
dataset = "data/processed/rr20"
splits = "data/splits.json"
output = "runs/rr_kernel_pca"

[training]
epochs = 6
classifier_epochs = 25
batch_size = 16
learning_rate = 0.001
classifier_learning_rate = 0.001
temperature = 0.1
balance_classifier = true
device = "cpu"

[model]
embedding_dim = 2
rr_statistics = true
kpca_components = 21
standardize = false
